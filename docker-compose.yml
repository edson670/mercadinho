services:
  postgres:
    image: postgres:16-alpine
    container_name: mercado_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mercado
      POSTGRES_PASSWORD: mercado
      POSTGRES_DB: mercado
    ports:
      - "5432:5432"
    volumes:
      - mercado_pgdata:/var/lib/postgresql/data
      # Cria o banco "evolution" automaticamente em instalações novas (volume vazio).
      # Se o volume já existir de uma instalação anterior, crie manualmente uma vez:
      #   docker exec mercado_postgres psql -U mercado -d mercado -c "CREATE DATABASE evolution;"
      - ./infra/init-evolution-db.sql:/docker-entrypoint-initdb.d/init-evolution-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercado -d mercado"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin opcional para inspeção do banco em dev
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mercado_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mercado.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # ── Pedidos por WhatsApp (docs/10-pedidos-whatsapp.md) ──
  # Opcional: comente/remova este bloco (e o redis abaixo) se preferir uma
  # instância da Evolution API separada — o backend só precisa das variáveis
  # EVOLUTION_BASE_URL/API_KEY/INSTANCE apontando para onde ela estiver.
  evolution-redis:
    image: redis:7-alpine
    container_name: mercado_evolution_redis
    restart: unless-stopped
    volumes:
      - mercado_evolution_redis_data:/data

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: mercado_evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      # Troque em produção — é a chave que o backend usa em EVOLUTION_API_KEY.
      AUTHENTICATION_API_KEY: "mercado-evolution-dev-key"
      SERVER_URL: http://localhost:8080

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://mercado:mercado@postgres:5432/evolution?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: mercado_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://evolution-redis:6379/6"
      CACHE_LOCAL_ENABLED: "false"

      # host.docker.internal: o backend roda no host (npm run start:dev), não em container.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: "http://host.docker.internal:3000/api/v1/webhooks/evolution?secret=${WEBHOOK_SECRET:-troque-por-um-segredo-de-webhook}"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"

      # Só nos interessa mensagem recebida — reduz ruído de eventos não usados.
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONTACTS_SET: "false"
      WEBHOOK_EVENTS_CONTACTS_UPSERT: "false"
      WEBHOOK_EVENTS_CONTACTS_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_SET: "false"
      WEBHOOK_EVENTS_CHATS_UPSERT: "false"
      WEBHOOK_EVENTS_CHATS_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_DELETE: "false"
      WEBHOOK_EVENTS_GROUPS_UPSERT: "false"
      WEBHOOK_EVENTS_GROUPS_UPDATE: "false"
      WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE: "false"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "false"
      WEBHOOK_EVENTS_LABELS_EDIT: "false"
      WEBHOOK_EVENTS_LABELS_ASSOCIATION: "false"
      WEBHOOK_EVENTS_CALL: "false"

      CONFIG_SESSION_PHONE_CLIENT: "Mercadinho"
    volumes:
      - mercado_evolution_instances:/evolution/instances

volumes:
  mercado_pgdata:
  mercado_evolution_redis_data:
  mercado_evolution_instances:
